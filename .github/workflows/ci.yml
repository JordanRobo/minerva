name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minerva
          POSTGRES_PASSWORD: minerva
          POSTGRES_DB: minerva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minerva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://minerva:minerva@localhost:5432/minerva
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      # The runtime image links against libpq (server.Dockerfile installs
      # libpq-dev in the builder); tests need it on the host too.
      - name: Install libpq-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      # Match deploy/docker/server.Dockerfile (rust:1.95-slim).
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95 --profile minimal -c rustfmt -c clippy && rustup default 1.95

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      # Match deploy/docker/web.Dockerfile (oven/bun:1.3).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # Build context is the repository root (the Dockerfiles live in
      # deploy/docker/ and reference paths outside it).
      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/server.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
