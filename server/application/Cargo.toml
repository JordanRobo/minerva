[package]
name = "application"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = "0.4"
domain = { path = "../domain" }
# Subject hashing for rate limiting (see application::rate_limit); the same
# one-way SHA-256 the session tokens use.
sha2 = { workspace = true }

[dev-dependencies]
# Test runtime for the SessionService unit tests only; never a runtime dep.
tokio = { version = "1", features = ["macros", "rt"] }
