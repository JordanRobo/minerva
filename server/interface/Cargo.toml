[package]
name = "interface"
version.workspace = true
edition.workspace = true

[[bin]]
name = "minerva-server"
path = "src/main.rs"

[dependencies]
# secure-cookies enables the cookie crate's authenticated-encryption jars,
# used to store the OIDC flow's one-time state (see src/oidc.rs).
actix-web = { workspace = true, features = ["secure-cookies"] }
tokio = { workspace = true }
serde_json = { workspace = true }
# chrono types appear in the Goals API DTOs and server-set timestamps.
chrono = { version = "0.4", features = ["serde"] }
# `serde` (derive) + `uuid` (serde) are for the API DTOs; both are already in
# the dependency tree via serde_json and domain.
serde = { version = "1", features = ["derive"] }
sha2 = { workspace = true }
uuid = { version = "1", features = ["serde"] }
# Typed configuration: layering (defaults < minerva.toml < env overrides) and
# TOML parsing; extraction is plain serde. The `env` feature is deliberately
# not used — its provider reads the real process environment at extract time,
# which would force tests to mutate (and serialize on) that environment; the
# MINERVA_ layer is built from an injectable variable list instead (src/config.rs).
figment = { version = "0.10", features = ["toml"] }
url = { workspace = true }
domain = { path = "../domain" }
application = { path = "../application" }
infrastructure = { path = "../infrastructure" }
utoipa = { version = "5.5.0", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }

[dev-dependencies]
# Only for the OIDC handler tests' fake provider (implements the async_trait-based port).
async-trait = { workspace = true }
# The handler tests build their own one-connection pools (test_pool in
# oidc.rs) so parallel test runs cannot exhaust Postgres's max_connections.
diesel = { workspace = true }
