[package]
name = "interface"
version.workspace = true
edition.workspace = true

[[bin]]
name = "minerva-server"
path = "src/main.rs"

[dependencies]
actix-web = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
# chrono types appear in the Goals API DTOs and server-set timestamps.
chrono = { version = "0.4", features = ["serde"] }
# `serde` (derive) + `uuid` (serde) are only for the temporary /debug query
# params; both are already in the dependency tree via serde_json and domain.
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }
domain = { path = "../domain" }
application = { path = "../application" }
infrastructure = { path = "../infrastructure" }
utoipa = { version = "5.5.0", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
