[workspace]
resolver = "2"
members = [
    "domain",
    "application",
    "infrastructure",
    "interface",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
actix-web = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
diesel = { version = "2", features = ["postgres"] }
redis = "0.27"
object_store = "0.10"
async-trait = "0.1"
