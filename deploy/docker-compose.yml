name: minerva

services:
    postgres:
        image: postgres:16-alpine
        container_name: minerva-postgres
        environment:
            POSTGRES_USER: minerva
            POSTGRES_PASSWORD: minerva
            POSTGRES_DB: minerva
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U minerva -d minerva"]
            interval: 5s
            timeout: 5s
            retries: 12

    redis:
        image: redis:7-alpine
        container_name: minerva-redis
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 12

    # Placeholder S3-compatible object storage for local dev.
    rustfs:
        image: rustfs/rustfs:latest
        container_name: minerva-rustfs
        environment:
            RUSTFS_ACCESS_KEY_ID: minerva
            RUSTFS_SECRET_ACCESS_KEY: minerva-dev-secret
            RUSTFS_ROOT: /data
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - rustfs-data:/data

    server:
        build:
            # Relative to this file's directory (deploy/), so the context is the repo root.
            context: ..
            dockerfile: deploy/docker/server.Dockerfile
        container_name: minerva-server
        environment:
            # Passed through from the environment / --env-file so a .env at
            # the repo root can override the dev defaults. These are the only
            # variables the compose file substitutes; everything else (OIDC,
            # cookies, migrations) is configured via minerva.toml or
            # MINERVA_-prefixed variables — see minerva.example.toml.
            PORT: "${PORT:-8080}"
            DATABASE_URL: ${DATABASE_URL:-postgresql://minerva:minerva@postgres:5432/minerva}
            REDIS_URL: ${REDIS_URL:-redis://redis:6379}
            # S3 object storage; reserved for roadmap item 7.1 (the adapter is
            # not built yet, so the server ignores these for now).
            S3_ENDPOINT: http://rustfs:9000
            S3_REGION: us-east-1
            S3_BUCKET: minerva
            S3_ACCESS_KEY_ID: minerva
            S3_SECRET_ACCESS_KEY: minerva-dev-secret
            # The public origin the browser sees (Caddy, below). The API's
            # own 3010 host mapping is for direct debugging, not the browser.
            # Used for absolute URLs: the OIDC redirect URL, invite and
            # password-reset links. Override with APP_ORIGIN in .env.
            MINERVA_SERVER__WEB_BASE_URL: ${APP_ORIGIN:-http://localhost:3000}
            # Caddy sets X-Forwarded-For, replacing any client-supplied
            # value. On Docker Desktop every dev client appears as the
            # bridge gateway, so all dev clients share one rate-limit
            # bucket (fine for dev; a production proxy sees real IPs).
            MINERVA_RATE_LIMIT__CLIENT_IP_HEADER: X-Forwarded-For
            # Per-setting overrides (highest precedence). To enable OIDC
            # without a config file, set e.g. in .env:
            # MINERVA_OIDC__ISSUER_URL=https://auth.example.com/application/o/minerva/
            # First-admin bootstrap (only takes effect while no users exist):
            MINERVA_BOOTSTRAP__ADMIN_EMAIL: admin@example.com
            MINERVA_BOOTSTRAP__ADMIN_PASSWORD: password_123
        ports:
            # Host port 3010 (host 8080 is used by gluetun on the dev machine).
            - "3010:8080"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        # Mount a local config file read-only. Commented out because Docker
        # creates a *directory* for a missing host file, which would then be
        # found and fail to parse; create minerva.toml first (see
        # minerva.example.toml) before uncommenting.
        # volumes:
        #     - ./minerva.toml:/etc/minerva/minerva.toml:ro

    web:
        build:
            # Relative to this file's directory (deploy/), so the context is the repo root.
            context: ..
            dockerfile: deploy/docker/web.Dockerfile
        container_name: minerva-web
        environment:
            PORT: "3000"
            # Public origin, for adapter-node: without it SvelteKit rejects
            # form-action POSTs as cross-site once the app sits behind Caddy.
            ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
            # Internal URL of the API for server-side loads
            # (apps/web/src/lib/server/api.ts), never the browser origin.
            API_INTERNAL_URL: http://server:8080
        # No host port: the browser reaches the web app through Caddy on 3000.

    caddy:
        # Same-origin reverse proxy (roadmap 6.1, D7; a small slice of 7.4
        # pulled forward): /api/* and /api-docs/* go to the API, everything
        # else to the web app. The session cookie is same-origin, so no CORS.
        image: caddy:2-alpine
        container_name: minerva-caddy
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
        ports:
            - "3000:80"
        depends_on:
            - server
            - web

volumes:
    postgres-data:
    redis-data:
    rustfs-data:
